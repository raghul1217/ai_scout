services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aiscout_app
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aiscout_user}:${POSTGRES_PASSWORD:-aiscout_secure_pwd_2026}@postgres:5432/${POSTGRES_DB:-aiscout_db}?schema=public
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://aiscout.in}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://aiscout.in}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID}
      - GOOGLE_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      - GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - SYNC_SECRET=${SYNC_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM:-AI Scout <hello@aiscout.in>}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aiscout_net

  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: aiscout_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiscout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiscout_secure_pwd_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aiscout_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiscout_user} -d ${POSTGRES_DB:-aiscout_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiscout_net

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.26-alpine
    container_name: aiscout_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - aiscout_net

volumes:
  postgres_data:
    driver: local

networks:
  aiscout_net:
    driver: bridge
